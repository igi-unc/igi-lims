{% extends "base.html" %}{% block content %}
<h1>{% if editing %}Edit participant {{ p.participant_id }}{% else %}New participant{% endif %}</h1>
<div class="card"><form method="post"><div class="grid">
  {% if not editing %}<label><span class="lbl">IGI participant code (leave blank to generate)</span><input type="text" name="participant_id" value="{{ p.participant_id or '' }}" placeholder="auto"></label>{% endif %}
  <label><span class="lbl">Cohort</span><select name="cohort_code" required>{% for c in cohorts %}<option value="{{ c.code }}" {% if p.cohort_code == c.code %}selected{% endif %}>{{ c.code }} – {{ c.meaning }}</option>{% endfor %}</select></label>
  <label><span class="lbl">Collection site's own ID (never printed on labels)</span><input type="text" name="external_participant_id" value="{{ p.external_participant_id or '' }}"></label>
  <label><span class="lbl">Site</span><select name="site_code"><option value="">—</option>{% for c in sites %}<option value="{{ c.code }}" {% if p.site_code == c.code %}selected{% endif %}>{{ c.code }} – {{ c.meaning }}</option>{% endfor %}</select></label>
  <label class="wide"><span class="lbl">Notes</span><textarea name="notes">{{ p.notes or '' }}</textarea></label>
</div><p><button type="submit">Save</button> <a class="btn secondary" href="{{ url_for('participants.list_participants') }}">Cancel</a></p></form></div>
{% endblock %}
