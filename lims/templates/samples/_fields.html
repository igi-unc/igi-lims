{# Shared processing/storage fields for create forms. Expects p, statuses, units, biobanks, sops, users, freezers, racks, boxes, positions. #}
<p class="muted">All fields are required. Choose <code>NA</code> (or 0 for quantity) where a field does not apply. Missing an option? Admins add entries under Codes.</p>
<label><span class="lbl">Number of tubes</span><input type="number" name="count" min="1" max="99" value="{{ p.count or 1 }}" required></label>
<label><span class="lbl">Processed on (date/time)</span><input type="datetime-local" name="created_datetime" value="{{ p.created_datetime or '' }}" required></label>
<label><span class="lbl">Operator</span><select name="created_by" required><option value="">—</option>{% for u in users %}<option value="{{ u.initials }}" {% if p.created_by == u.initials %}selected{% endif %}>{{ u.initials }} – {{ u.display_name }}</option>{% endfor %}</select></label>
<label><span class="lbl">SOP / protocol</span><select name="sop_code" required><option value="">—</option>{% for c in sops %}<option value="{{ c.code }}" {% if p.sop_code == c.code %}selected{% endif %}>{{ c.code }} – {{ c.meaning }}</option>{% endfor %}</select></label>
<label><span class="lbl">Biobank source</span><select name="biobank_source" required><option value="">—</option>{% for c in biobanks %}<option value="{{ c.code }}" {% if p.biobank_source == c.code %}selected{% endif %}>{{ c.code }} – {{ c.meaning }}</option>{% endfor %}</select></label>
<label><span class="lbl">Quantity (per tube)</span><input type="number" step="any" name="quantity" value="{{ p.quantity if p.quantity is not none else '' }}" required placeholder="0 if not applicable"></label>
<label><span class="lbl">Unit</span><select name="unit" required><option value="">—</option>{% for c in units %}<option value="{{ c.code }}" {% if p.unit == c.code %}selected{% endif %}>{{ c.code }}</option>{% endfor %}</select></label>
<label><span class="lbl">Status</span><select name="status" required>{% for c in statuses %}<option value="{{ c.code }}" {% if (p.status or 'Available') == c.code %}selected{% endif %}>{{ c.code }}</option>{% endfor %}</select></label>
<label><span class="lbl">Freezer</span><select name="freezer" required><option value="">—</option>{% for c in freezers %}<option value="{{ c.code }}" {% if p.freezer == c.code %}selected{% endif %}>{{ c.code }}{% if c.meaning != c.code %} – {{ c.meaning }}{% endif %}</option>{% endfor %}</select></label>
<label><span class="lbl">Rack</span><select name="rack" required><option value="">—</option>{% for c in racks %}<option value="{{ c.code }}" {% if p.rack == c.code %}selected{% endif %}>{{ c.code }}</option>{% endfor %}</select></label>
<label><span class="lbl">Box</span><select name="box" required><option value="">—</option>{% for c in boxes %}<option value="{{ c.code }}" {% if p.box == c.code %}selected{% endif %}>{{ c.code }}</option>{% endfor %}</select></label>
<label><span class="lbl">Position (first tube)</span><select name="position" required><option value="">—</option>{% for c in positions %}<option value="{{ c.code }}" {% if p.position == c.code %}selected{% endif %}>{{ c.code }}</option>{% endfor %}</select></label>
<label class="wide"><span class="lbl">Notes</span><textarea name="notes" required placeholder="NA if nothing to note">{{ p.notes or '' }}</textarea></label>
